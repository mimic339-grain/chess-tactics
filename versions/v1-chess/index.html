<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チェス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="board-wrap">
      <div id="board" class="board"></div>
    </section>
    <aside class="panel">
      <h1>チェス</h1>
      <div id="status" class="status"></div>
      <div class="buttons">
        <button id="btn-new">新しいゲーム</button>
        <button id="btn-undo">一手戻す</button>
        <button id="btn-flip">盤を反転</button>
      </div>
      <label class="toggle"><input type="checkbox" id="cpu-toggle"> CPU と対戦（CPU は黒）</label>
      <h2>棋譜</h2>
      <ol id="moves" class="moves"></ol>
    </aside>
  </main>

  <div id="promo" class="promo hidden">
    <div class="promo-box">
      <p>昇格する駒を選んでください</p>
      <div id="promo-choices" class="promo-choices"></div>
    </div>
  </div>

  <script src="js/pieces.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
