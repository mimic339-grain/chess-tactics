<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ルールテスト</title></head>
<body style="font-family: Consolas, monospace; background:#222; color:#eee; padding:16px">
<h1>ルールエンジンのテスト</h1>
<p>既知の局面で「n手先までの局面数」を数えて正解と比べます（数秒かかります）。</p>
<pre id="out">実行中…</pre>
<script src="js/pieces.js"></script>
<script src="js/engine.js"></script>
<script>
function perft(state, depth) {
  const moves = allLegalMoves(state);
  if (depth === 1) return moves.reduce((n, m) => n + (m.promote ? PROMOTION_CHOICES.length : 1), 0);
  let n = 0;
  for (const m of moves) {
    if (m.promote) for (const t of PROMOTION_CHOICES) n += perft(applyMove(state, { ...m, promotion: t }), depth - 1);
    else n += perft(applyMove(state, m), depth - 1);
  }
  return n;
}
const cases = [
  ['初期局面', 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', [20, 400, 8902]],
  ['Kiwipete', 'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1', [48, 2039, 97862]],
  ['Position3', '8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1', [14, 191, 2812, 43238]],
  ['Position4', 'r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1', [6, 264, 9467]],
];
setTimeout(() => {
  const out = [];
  for (const [name, fen, exp] of cases) {
    const s = createStateFromFEN(fen);
    exp.forEach((e, i) => { const g = perft(s, i + 1); out.push(`${g === e ? 'OK' : 'NG'}  ${name} depth ${i + 1}: ${g}（正解 ${e}）`); });
  }
  document.getElementById('out').textContent = out.join('\n');
}, 50);
</script>
</body>
</html>
